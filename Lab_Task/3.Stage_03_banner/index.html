<!DOCTYPE html>
<html lang="en">

    <!-- =====[Start - head]-->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>I-Shop</title>

        <!-- External CSS -->
        <link rel="stylesheet" href="styles.css" />
    </head>
    <!-- ==== [End - head]==== -->


    <!-- ====[Start - body]==== -->
    <body>
        <!-- ## Header (Top Nav Bar) ## -->
        <header class="site-header">
            <nav class="navbar">

                <!-- Logo -->
                <a href="#" class="logo">
                    <img src="images/logo.png" alt="I-Shop logo">
                </a>

                <!-- Nav Links -->
                <ul class="nav-links">
                    <li>
                        <a href="#">Home</a>
                    </li>

                    <li>
                        <a href="#products">Products</a>
                    </li>

                    <li>
                        <a href="#">About</a>
                    </li>

                    <li>
                        <a href="#">Contact</a>
                    </li>
                </ul>

            </nav>
        </header>
        
        <!-- ## Main Content ## -->
        <main>
            <!-- Banner -->
            <section class="banner">
                <div class="banner-content">

                    <h1>
                        Discover Amazing Products
                    </h1>

                    <p>
                        Find simple, useful and beautiful products
                        made for everyday life.
                    </p>

                    <button type="button" class="banner-button" onclick="location.href='#products'">
                        Shop Now
                    </button>
                </div>
            </section>

            <!-- Product List -->
        </main>

        <!-- ## Footer ## -->
        <footer class="site-footer">
            <p>
                &copy; 2026 I-Shop. All rights reserved.
            </p>
        </footer>

    </body>
    <!-- ====[End - body]====   -->
</html>
