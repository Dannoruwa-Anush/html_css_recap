<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Selectors Practice</title>

    <link rel="stylesheet" href="activity2.css">
</head>

<body>

    <!-- ID Selector -->
    <h1 id="main-title">
        CSS Selectors Practice
    </h1>


    <!-- Class Selector -->
    <h2 class="section-title">
        Products
    </h2>


    <!-- Element Selector -->
    <p>
        Welcome to our product page.
    </p>


    <p class="important">
        This is an important message.
    </p>


    <!-- Parent / Child Selectors -->
    <div class="product">

        <h3>
            Wireless Headphones
        </h3>

        <p>
            High-quality wireless headphones.
        </p>

        <button>
            Buy Now
        </button>

    </div>


    <div class="product">

        <h3>
            Smart Watch
        </h3>

        <p>
            A modern smartwatch for everyday use.
        </p>

        <button>
            Buy Now
        </button>

    </div>


    <!-- Attribute Selectors -->
    <form>

        <input type="text" placeholder="Your name">

        <input type="email" placeholder="Your email">

        <input type="password" placeholder="Your password">

    </form>


    <!-- Pseudo-class Selectors -->
    <ul class="menu">

        <li>
            Home
        </li>

        <li>
            Products
        </li>

        <li>
            About
        </li>

        <li>
            Contact
        </li>

    </ul>

</body>

</html>
