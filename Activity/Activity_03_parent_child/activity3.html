<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parent Child CSS Practice</title>

    <link rel="stylesheet" href="activity3.css">
</head>

<body>

    <div class="parent">

        <h1>
            Parent Heading
        </h1>

        <p>
            Child Paragraph
        </p>

        <button>
            Child Button
        </button>

        <div class="child-box">

            <h2>
                Nested Child Heading
            </h2>

            <p>
                Nested Child Paragraph
            </p>

        </div>

    </div>

</body>

</html>
